name: blueverse

services:
  edge-nginx:
    image: dhi.io/nginx:1.30-alpine
    container_name: blueverse-edge-nginx
    restart: unless-stopped
    ports:
      - "${BLUEVERSE_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./infrastructure/docker/edge-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/public/404.html:/usr/share/nginx/html/404.html:ro
      - ./apps/web/public/500.html:/usr/share/nginx/html/500.html:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - blueverse_edge
      - blueverse_internal

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: blueverse-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - blueverse_edge

  postgres:
    image: dhi.io/postgres:16-alpine
    container_name: blueverse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blueverse}
      POSTGRES_USER: ${POSTGRES_USER:-blueverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - blueverse_postgres_data:/var/lib/postgresql
    networks:
      - blueverse_database

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      args:
        PROJECT_NAME: Blueverse.Api
    container_name: blueverse-api
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "dotnet", "Blueverse.Api.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: ${API_HTTP_PORT:-8080}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      COASTAL_OPERATIONS_CONTEXT_KEY: ${COASTAL_OPERATIONS_CONTEXT_KEY:?Set COASTAL_OPERATIONS_CONTEXT_KEY in .env}
      ReverseProxy__Clusters__auth__Destinations__auth__Address: ${AUTH_SERVICE_URL:-http://auth:8080}
      ReverseProxy__Clusters__coastal-operations__Destinations__coastal-operations__Address: ${COASTAL_OPERATIONS_SERVICE_URL:-http://coastal-operations:8080}
      MARINE_ACTOR_SIGNING_KEY: ${MARINE_ACTOR_SIGNING_KEY:?Set MARINE_ACTOR_SIGNING_KEY in .env}
      ReverseProxy__Clusters__coastal-planner__Destinations__coastal-planner__Address: ${COASTAL_PLANNER_SERVICE_URL:-http://coastal-planner:8080}
      ReverseProxy__Clusters__marine-safety__Destinations__marine-safety__Address: ${MARINE_SAFETY_SERVICE_URL:-http://marine-safety:8080}
      ReverseProxy__Clusters__experience-biodiversity__Destinations__experience-biodiversity__Address: ${EXPERIENCE_BIODIVERSITY_SERVICE_URL:-http://experience-biodiversity:8080}
    depends_on:
      auth:
        condition: service_healthy
      coastal-operations:
        condition: service_healthy
      marine-safety:
        condition: service_healthy
      experience-biodiversity:
        condition: service_healthy
      coastal-planner:
        condition: service_healthy
    networks:
      - blueverse_internal

  marine-safety:
    build:
      context: .
      dockerfile: infrastructure/docker/marine-safety/Dockerfile
      args:
        PROJECT_NAME: Blueverse.MarineSafety
    container_name: blueverse-marine-safety
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "dotnet", "Blueverse.MarineSafety.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: ${MARINE_SAFETY_HTTP_PORT:-8080}
      MARINE_ACTOR_SIGNING_KEY: ${MARINE_ACTOR_SIGNING_KEY:?Set MARINE_ACTOR_SIGNING_KEY in .env}
      EXPERIENCE_CATALOGUE_URL: ${EXPERIENCE_CATALOGUE_URL:-http://experience-biodiversity:8080}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-blueverse};Username=${POSTGRES_USER:-blueverse};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OpenMeteo__WeatherBaseUrl: ${OPEN_METEO_WEATHER_URL:-https://api.open-meteo.com/}
      OpenMeteo__MarineBaseUrl: ${OPEN_METEO_MARINE_URL:-https://marine-api.open-meteo.com/}
      OpenMeteo__FreshnessMaxAgeMinutes: ${OPEN_METEO_FRESHNESS_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueverse_internal
      - blueverse_database

  auth:
    build:
      context: .
      dockerfile: infrastructure/docker/auth/Dockerfile
      args:
        PROJECT_NAME: Blueverse.Auth
    container_name: blueverse-auth
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "dotnet", "Blueverse.Auth.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: ${AUTH_HTTP_PORT:-8080}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__AccessTokenMinutes: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
      AuthSession__DefaultLifetimeDays: ${AUTH_DEFAULT_SESSION_DAYS:-1}
      AuthSession__RememberMeLifetimeDays: ${AUTH_REMEMBER_ME_SESSION_DAYS:-30}
      AuthSession__SelfServicePlannerAccess: ${AUTH_SELF_SERVICE_PLANNER_ACCESS:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-blueverse};Username=${POSTGRES_USER:-blueverse};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueverse_internal
      - blueverse_database

  coastal-operations:
    build:
      context: .
      dockerfile: infrastructure/docker/coastal-operations/Dockerfile
      args:
        PROJECT_NAME: Blueverse.CoastalOperations
    container_name: blueverse-coastal-operations
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "dotnet", "Blueverse.CoastalOperations.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: ${COASTAL_OPERATIONS_HTTP_PORT:-8080}
      COASTAL_OPERATIONS_CONTEXT_KEY: ${COASTAL_OPERATIONS_CONTEXT_KEY:?Set COASTAL_OPERATIONS_CONTEXT_KEY in .env}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-blueverse};Username=${POSTGRES_USER:-blueverse};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ComponentDependencies__Member1Experience__BaseAddress: ${EXPERIENCE_SERVICE_URL:-http://experience-biodiversity:8080}
      EvidenceStorage__RootPath: /var/lib/coastal-operations/evidence
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueverse_internal
      - blueverse_database
    volumes:
      - blueverse_coastal_operations_evidence:/var/lib/coastal-operations/evidence

  coastal-planner:
    build:
      context: .
      dockerfile: infrastructure/docker/coastal-planner/Dockerfile
      args:
        PROJECT_NAME: Blueverse.CoastalPlanner
    container_name: blueverse-coastal-planner
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: ${COASTAL_PLANNER_HTTP_PORT:-8080}
      PeerServices__ExperienceCatalogueUrl: ${EXPERIENCE_CATALOGUE_URL:-http://api:8080}
      PeerServices__MarineConditionsUrl: ${MARINE_CONDITIONS_URL:-http://api:8080}
      PeerServices__CoastalOperationsUrl: ${COASTAL_OPERATIONS_URL:-http://api:8080}
      PeerServices__BiodiversityMlUrl: ${BIODIVERSITY_ML_URL:-http://it3091-fake:8080}
      PeerServices__BiodiversityApiKey: ${BIODIVERSITY_ML_API_KEY:-}
      PeerServices__BiodiversityEnabled: ${BIODIVERSITY_ML_ENABLED:-true}
      PeerServices__BiodiversityExpectedModelVersion: ${BIODIVERSITY_ML_MODEL_VERSION:-fake-v1}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-blueverse};Username=${POSTGRES_USER:-blueverse};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "dotnet", "Blueverse.CoastalPlanner.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueverse_internal
      - blueverse_database

  experience-biodiversity:
    build:
      context: .
      dockerfile: infrastructure/docker/experience-biodiversity/Dockerfile
      args:
        PROJECT_NAME: Blueverse.ExperienceBiodiversity
    container_name: blueverse-experience-biodiversity
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "dotnet", "Blueverse.ExperienceBiodiversity.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-blueverse};Username=${POSTGRES_USER:-blueverse};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Services__MarineSafetyUrl: ${MARINE_SAFETY_SERVICE_URL:-http://marine-safety:8080}
      Services__PlannerServiceUrl: ${PLANNER_SERVICE_URL:-http://coastal-planner:8080}
      Services__OperationsServiceUrl: ${OPERATIONS_SERVICE_URL:-http://coastal-operations:8080}
      Services__PublicApiUrl: ${PUBLIC_API_URL:-http://api:8080}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueverse_internal
      - blueverse_database

  agent-experience-biodiversity:
    profiles: ["agentic-ai"]
    build:
      context: .
      dockerfile: infrastructure/docker/agentic-ai/experience-biodiversity/Dockerfile
    image: blueverse/agent-experience-biodiversity:local
    networks:
      - blueverse_internal

  agent-marine-conditions:
    profiles: ["agentic-ai"]
    build:
      context: .
      dockerfile: infrastructure/docker/agentic-ai/marine-conditions/Dockerfile
    image: blueverse/agent-marine-conditions:local
    expose:
      - "8080"
    environment:
      PORT: 8080
      OPEN_METEO_WEATHER_URL: ${OPEN_METEO_WEATHER_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_MARINE_URL: ${OPEN_METEO_MARINE_URL:-https://marine-api.open-meteo.com/v1/marine}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    networks:
      - blueverse_internal

  agent-planning-coordination:
    profiles: ["agentic-ai"]
    build:
      context: .
      dockerfile: infrastructure/docker/agentic-ai/planning-coordination/Dockerfile
    image: blueverse/agent-planning-coordination:local
    networks:
      - blueverse_internal

  agent-safety-operations:
    profiles: ["agentic-ai"]
    build:
      context: .
      dockerfile: infrastructure/docker/agentic-ai/safety-operations/Dockerfile
    image: blueverse/agent-safety-operations:local
    networks:
      - blueverse_internal

  it3091-fake:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: infrastructure/docker/coastal-planner/fake-it3091.Dockerfile
    container_name: blueverse-it3091-fake
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: 8080
      IT3091_FAKE_BEHAVIOR: ${IT3091_FAKE_BEHAVIOR:-valid}
      IT3091_FAKE_API_KEY: ${BIODIVERSITY_ML_API_KEY:-}
    networks:
      - blueverse_internal
networks:
  blueverse_edge:
    name: blueverse_edge
  blueverse_internal:
    name: blueverse_internal
    internal: true
  blueverse_agent_egress:
    name: blueverse_agent_egress
  blueverse_database:
    name: blueverse_database

volumes:
  blueverse_postgres_data:
    name: blueverse_postgres_data
  blueverse_coastal_operations_evidence:
    name: blueverse_coastal_operations_evidence
