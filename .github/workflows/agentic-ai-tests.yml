name: Agentic AI Tests

on:
  push:
    branches: ["main", "dev", "agentic-ai/**"]
  pull_request:
    branches: ["main", "dev", "agentic-ai/**"]

permissions:
  contents: read

jobs:
  agentic-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install common AI test tooling
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: Run all Agentic AI service test suites
        id: tests
        shell: bash
        run: |
          set +e
          mkdir -p test-results/ai
          echo "Test pass/fail is determined by the complete test assertions, not by one response field or HTTP status alone."
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/services:${PYTHONPATH:-}"
          overall_status=0
          service_dirs=()
          ai_roots=(services/ai services/ai-agents services/agents)

          for ai_root in "${ai_roots[@]}"; do
            while IFS= read -r -d '' test_dir; do
              if find "$test_dir" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
                service_dirs+=("$test_dir")
              fi
            done < <(find "$ai_root" -type d -name tests -print0 2>/dev/null | sort -z)
          done

          if [[ ${#service_dirs[@]} -eq 0 ]]; then
            echo "No Agentic AI test suites found under services/ai, services/ai-agents, or services/agents."
            echo "This workflow currently reports zero tests until AI service tests are added."
            python .github/scripts/report_test_metrics.py --results-root test-results/ai --scope "Agentic AI"
            exit 0
          fi

          for service_dir in "${service_dirs[@]}"; do
            service_root="${service_dir%/tests}"
            service="${service_root#services/}"
            case "$service" in
              ai/*) service="${service#ai/}" ;;
              ai-agents/*) service="${service#ai-agents/}" ;;
              agents/*) service="${service#agents/}" ;;
            esac
            result_dir="test-results/ai/$service"
            mkdir -p "$result_dir"
            echo "============================================================"
            echo "AGENTIC AI SERVICE: $service"
            echo "TEST DIRECTORY: $service_dir"
            echo "============================================================"

            requirements=$(find "$service_root" -maxdepth 1 -type f -name 'requirements*.txt' -print -quit)
            if [[ -n "$requirements" ]]; then
              python -m pip install -r "$requirements"
              if [[ $? -ne 0 ]]; then
                overall_status=1
                echo "Dependency installation failed for Agentic AI service '$service'."
                continue
              fi
            fi

            pyproject=$(find "$service_root" -maxdepth 1 -type f -name 'pyproject.toml' -print -quit)
            if [[ -n "$pyproject" ]]; then
              python -m pip install -e "$service_root"
              if [[ $? -ne 0 ]]; then
                overall_status=1
                echo "Package installation failed for Agentic AI service '$service'."
                continue
              fi
            fi

            pytest "$service_dir" --junitxml="$result_dir/junit.xml" -q 2>&1 | tee "$result_dir/console.log"
            service_status=${PIPESTATUS[0]}
            if [[ "$service_status" -ne 0 ]]; then
              overall_status=1
              echo "Agentic AI service '$service' failed with exit code $service_status."
            else
              echo "Agentic AI service '$service' completed successfully."
            fi
          done

          python .github/scripts/report_test_metrics.py --results-root test-results/ai --scope "Agentic AI"
          exit "$overall_status"

      - name: Upload Agentic AI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentic-ai-test-results
          path: test-results/ai
          if-no-files-found: ignore

      - name: Final failed Agentic AI test case list
        if: always()
        shell: bash
        run: python .github/scripts/report_test_metrics.py --results-root test-results/ai --scope "Agentic AI" --failures-only
