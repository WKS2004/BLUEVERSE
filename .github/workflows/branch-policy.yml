name: Branch Name Policy

on:
  create:

permissions:
  contents: write

jobs:
  validate-branch-name:
    name: Validate newly created branch
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming policy
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.ref;
            const allowed = branch === 'main' ||
              branch === 'dev' ||
              branch === 'dev-backup' ||
              branch === 'default-template' ||
              /^features\/.+$/.test(branch) ||
              /^agentic-ai\/.+$/.test(branch) ||
              /^dev-backup-mistaken-commits\/[^/]+\/.+$/.test(branch) ||
              /^(claude|codex|antigravity|gemini|maintenance|bug-fixes|github-sync|docker-workflow-changes)\/.+$/.test(branch);

            if (allowed && branch === branch.toLowerCase()) {
              core.info(`Branch '${branch}' follows the repository naming policy.`);
              return;
            }

            core.warning(`Branch '${branch}' is invalid. Branches must be lowercase and match: main, dev, dev-backup, default-template, features/**, agentic-ai/**, claude/**, codex/**, antigravity/**, gemini/**, maintenance/**, bug-fixes/**, github-sync/**, docker-workflow-changes/**, or dev-backup-mistaken-commits/**.`);
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            core.setFailed(`Deleted branch '${branch}' because it does not match the repository policy.`);
