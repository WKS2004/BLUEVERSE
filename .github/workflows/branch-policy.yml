name: Branch Name Policy

on:
  create:

permissions:
  contents: write

jobs:
  validate-branch-name:
    name: Validate newly created branch
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming policy
        uses: actions/github-script@v7
        with:
          script: |
            const branch = String(context.payload.ref || '');
            const matchesPolicy = branch === 'main' ||
              branch === 'dev' ||
              branch === 'dev-backup' ||
              branch === 'default-template' ||
              /^features\/.+$/.test(branch) ||
              /^agentic-ai\/.+$/.test(branch) ||
              /^dev-backup-mistaken-commits\/[^/]+\/.+$/.test(branch) ||
              /^(claude|codex|antigravity|gemini|maintenance|bug-fixes|docker-workflow-changes)\/.+$/.test(branch);
            const isLowercase = branch === branch.toLowerCase();

            if (matchesPolicy && isLowercase) {
              core.info(`Branch '${branch}' follows the repository naming policy.`);
              return;
            }

            core.warning(`Branch '${branch}' is invalid. It must already be lowercase and match an approved repository branch pattern. The policy deletes it instead of renaming it so the original creator keeps clear ownership of valid branches.`);
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            core.setFailed(`Deleted branch '${branch}' because it does not match the repository policy.`);
