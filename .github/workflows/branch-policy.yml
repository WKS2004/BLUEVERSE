name: Branch Name Policy

on:
  create:

permissions:
  contents: write

jobs:
  validate-branch-name:
    name: Validate newly created branch
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming policy
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.ref;
            // Normalize first. Lowercasing is intentionally idempotent.
            const normalized = branch.toLowerCase();
            const originalRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            const sha = originalRef.data.object.sha;
            const allowed = normalized === 'main' ||
              normalized === 'dev' ||
              /^features\/.+$/.test(normalized);

            if (branch !== normalized) {
              core.warning(`Normalizing branch '${branch}' to lowercase '${normalized}'.`);

              if (!allowed) {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.setFailed(`Deleted branch '${branch}' because its lowercase name is not allowed.`);
                return;
              }

              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${normalized}`
                });
                core.info(`Lowercase branch '${normalized}' already exists; preserving it.`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/heads/${normalized}`,
                  sha
                });
              }

              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`Branch '${branch}' was replaced with '${normalized}'.`);
              return;
            }

            if (allowed) {
              core.info(`Branch '${branch}' follows the repository naming policy.`);
              return;
            }

            core.warning(`Branch '${branch}' does not match the allowed patterns: main, dev, features/**.`);
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            core.setFailed(`Deleted branch '${branch}' because its name does not match the repository policy.`);
