name: Backend CI

on:
  push:
    branches: ["main", "dev", "features/**", "agentic-ai/**", "claude/**", "codex/**", "antigravity/**", "gemini/**", "maintenance/**", "bug-fixes/**"]
    paths:
      - "services/**"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main", "dev", "features/**", "agentic-ai/**", "claude/**", "codex/**", "antigravity/**", "gemini/**", "maintenance/**", "bug-fixes/**"]
    paths:
      - "services/**"
      - "global.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Determine scope
        id: scope
        shell: bash
        run: |
          target="${{ github.ref_name }}"; range="${{ github.event.before }}..${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then target="${{ github.base_ref }}"; range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"; fi
          if [[ "$target" == "main" || "$target" == "dev" || ("${{ github.event_name }}" == "push" && "${{ github.event.before }}" =~ ^0+$) ]] || git diff --name-only "$range" | grep -Eq '^(services/|global\.json$|\.github/workflows/backend-ci\.yml$)'; then echo affected=true >> "$GITHUB_OUTPUT"; else echo affected=false >> "$GITHUB_OUTPUT"; fi
      - name: Not affected
        if: steps.scope.outputs.affected != 'true'
        run: |
          echo "Not affected - no backend changes."
          {
            echo "## Backend CI: Not affected"
            echo "No backend paths changed; restore/build was not required."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-dotnet@v5
        if: steps.scope.outputs.affected == 'true'
        with: { global-json-file: global.json }
      - name: Restore and build backend projects
        if: steps.scope.outputs.affected == 'true'
        shell: bash
        run: |
          projects=$(find services -name '*.csproj' -print 2>/dev/null || true)
          if [ -z "$projects" ]; then echo "No backend projects yet."; exit 0; fi
          while IFS= read -r project; do dotnet restore "$project"; dotnet build "$project" --configuration Release --no-restore; done <<< "$projects"
