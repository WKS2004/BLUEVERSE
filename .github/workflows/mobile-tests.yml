name: Flutter Mobile Tests

on:
  push:
    branches: ["main", "dev", "features/**", "agentic-ai/**"]
  pull_request:
    branches: ["main", "dev", "features/**", "agentic-ai/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze Flutter application
        working-directory: apps/mobile
        run: flutter pub get && flutter analyze

      - name: Run all Flutter mobile test cases
        id: tests
        shell: bash
        run: |
          set +e
          mkdir -p test-results/mobile
          echo "Test pass/fail is determined by the complete test assertions, not by one response field or HTTP status alone."

          package_tests=$(find apps/mobile/test -type f -name '*_test.dart' -print 2>/dev/null)
          integration_tests=$(find apps/mobile/integration_test -type f -name '*_test.dart' -print 2>/dev/null)

          test_status=0
          input_args=()
          if [[ -n "$package_tests" ]]; then
            echo "Running Flutter unit/widget tests from apps/mobile/test"
            (cd apps/mobile && flutter test --machine test) > test-results/mobile/flutter-machine.json 2>&1
            unit_status=$?
            input_args+=(--input test-results/mobile/flutter-machine.json)
            if [[ "$unit_status" -ne 0 ]]; then test_status=1; fi
          fi

          if [[ -n "$integration_tests" ]]; then
            echo "Running Flutter integration tests from apps/mobile/integration_test"
            (cd apps/mobile && flutter test --machine integration_test) > test-results/mobile/flutter-integration-machine.json 2>&1
            integration_status=$?
            input_args+=(--input test-results/mobile/flutter-integration-machine.json)
            if [[ "$integration_status" -ne 0 ]]; then test_status=1; fi
          fi

          if [[ ${#input_args[@]} -eq 0 ]]; then
            echo "No Flutter test cases found in apps/mobile/test or apps/mobile/integration_test."
            printf '0\n' > test-results/mobile/no-tests.marker
          fi

          metrics_status=0
          if [[ ${#input_args[@]} -gt 0 ]]; then
            python .github/scripts/report_test_metrics.py "${input_args[@]}" --format flutter --scope "Flutter Mobile" --require-results
            metrics_status=$?
          else
            python .github/scripts/report_test_metrics.py --results-root test-results/mobile --scope "Flutter Mobile"
            metrics_status=$?
          fi
          if [[ "$test_status" -eq 0 && "$metrics_status" -ne 0 ]]; then
            test_status=$metrics_status
          fi
          exit "$test_status"

      - name: Upload Flutter test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-mobile-test-results
          path: test-results/mobile
          if-no-files-found: ignore

      - name: Final failed Flutter test case list
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/mobile/flutter-machine.json || -f test-results/mobile/flutter-integration-machine.json ]]; then
            input_args=()
            [[ -f test-results/mobile/flutter-machine.json ]] && input_args+=(--input test-results/mobile/flutter-machine.json)
            [[ -f test-results/mobile/flutter-integration-machine.json ]] && input_args+=(--input test-results/mobile/flutter-integration-machine.json)
            python .github/scripts/report_test_metrics.py "${input_args[@]}" --format flutter --scope "Flutter Mobile" --failures-only
          else
            python .github/scripts/report_test_metrics.py --results-root test-results/mobile --scope "Flutter Mobile" --failures-only
          fi
