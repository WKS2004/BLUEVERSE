name: Update Dev Backup

on:
  push:
    branches: ["dev"]

permissions:
  contents: write

jobs:
  sync:
    name: Synchronize dev-backup
    runs-on: ubuntu-latest
    steps:
      - name: Update dev-backup to the latest dev commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dev = await github.rest.git.getRef({ owner, repo, ref: 'heads/dev' });
            const sha = dev.data.object.sha;

            try {
              await github.rest.git.getRef({ owner, repo, ref: 'heads/dev-backup' });
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'heads/dev-backup',
                sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/heads/dev-backup',
                sha
              });
            }
            core.info(`dev-backup now points to ${sha}.`);
