name: Maintain Dev Backup

on:
  push:
    branches: ["dev", "dev-backup"]

permissions:
  contents: write

concurrency:
  group: dev-backup-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Preserve mistaken commits and synchronize dev-backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve mistaken dev-backup commits and synchronize
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          dev_sha=$(git rev-parse origin/dev)

          if ! git ls-remote --exit-code --heads origin dev-backup >/dev/null 2>&1; then
            git push origin "${dev_sha}:refs/heads/dev-backup"
            echo "dev-backup did not exist; created it from dev at ${dev_sha}."
            exit 0
          fi

          git fetch origin dev-backup
          backup_sha=$(git rev-parse origin/dev-backup)
          if [ "$dev_sha" = "$backup_sha" ]; then
            echo "dev-backup already matches dev at $dev_sha."
            exit 0
          fi

          mistaken_commits=$(git rev-list --reverse "origin/dev..origin/dev-backup")
          if [ -n "$mistaken_commits" ]; then
            timestamp=$(date -u '+%Y-%m-%d-%H-%M-%S-%3N')
            actor=$(printf '%s' "$ACTOR" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
            rescue_branch="dev-backup-mistaken-commits/${actor}/${timestamp}"

            git switch --create "$rescue_branch" "origin/dev"

            while IFS= read -r commit; do
              [ -n "$commit" ] || continue
              parent_count=$(git rev-list --parents -n 1 "$commit" | wc -w)
              cherry_pick_status=0
              if [ "$parent_count" -gt 2 ]; then
                git cherry-pick -m 1 "$commit" || cherry_pick_status=$?
              else
                git cherry-pick "$commit" || cherry_pick_status=$?
              fi
              if [ "$cherry_pick_status" -ne 0 ]; then
                if git diff --name-only --diff-filter=U | grep -q .; then
                  echo "Cherry-pick conflict while preserving ${commit}; stopping before synchronization."
                  exit "$cherry_pick_status"
                fi
                git cherry-pick --skip
              fi
            done <<< "$mistaken_commits"
            git push origin "HEAD:refs/heads/${rescue_branch}"
            echo "Preserved mistaken commits on ${rescue_branch}."
          fi

          git push --force origin "${dev_sha}:refs/heads/dev-backup"
          echo "dev-backup synchronized with dev at ${dev_sha}."
