name: Flutter Mobile CI

on:
  push:
    branches: ["main", "dev", "features/**"]
  pull_request:
    branches: ["main", "dev", "features/**"]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Determine scope
        id: scope
        shell: bash
        run: |
          target="${{ github.ref_name }}"; range="${{ github.event.before }}..${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then target="${{ github.base_ref }}"; range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"; fi
          if [[ "$target" == "main" || "$target" == "dev" ]] || git diff --name-only "$range" | grep -Eq '^(apps/mobile/|\.github/workflows/mobile-ci\.yml$)'; then echo affected=true >> "$GITHUB_OUTPUT"; else echo affected=false >> "$GITHUB_OUTPUT"; fi
      - name: Not affected
        if: steps.scope.outputs.affected != 'true'
        run: echo "Not affected - no Flutter mobile changes."
      - uses: subosito/flutter-action@v2
        if: steps.scope.outputs.affected == 'true'
        with: { channel: stable, cache: true }
      - name: Analyze mobile application
        if: steps.scope.outputs.affected == 'true'
        working-directory: apps/mobile
        run: flutter pub get && flutter analyze
