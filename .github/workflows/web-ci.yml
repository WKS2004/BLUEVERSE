name: React Web CI

on:
  push:
    branches: ["main", "dev", "features/**", "agentic-ai/**", "claude/**", "codex/**", "antigravity/**", "gemini/**", "maintenance/**", "bug-fixes/**"]
  pull_request:
    branches: ["main", "dev", "features/**", "agentic-ai/**", "claude/**", "codex/**", "antigravity/**", "gemini/**", "maintenance/**", "bug-fixes/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Determine scope
        id: scope
        shell: bash
        run: |
          target="${{ github.ref_name }}"; range="${{ github.event.before }}..${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then target="${{ github.base_ref }}"; range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"; fi
          if [[ "$target" == "main" || "$target" == "dev" ]] || git diff --name-only "$range" | grep -Eq '^(apps/web/|docs/contracts/ui-integration\.json$|docs/development/ui-integration\.md$|scripts/validation/|\.github/workflows/(web-ci|ui-integration)\.yml$)'; then echo affected=true >> "$GITHUB_OUTPUT"; else echo affected=false >> "$GITHUB_OUTPUT"; fi
      - name: Not affected
        if: steps.scope.outputs.affected != 'true'
        run: |
          echo "Not affected - no React web changes."
          {
            echo "## React Web CI: Not affected"
            echo "No React web paths changed; lint/build was not required."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.affected == 'true'
        with: { node-version: 24 }
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.affected == 'true'
        with: { python-version: "3.12" }
      - name: Validate shared UI/API integration contract
        if: steps.scope.outputs.affected == 'true'
        run: python scripts/validation/validate_ui_integrations.py
      - name: Lint and build
        if: steps.scope.outputs.affected == 'true'
        working-directory: apps/web
        run: npm install && npm run lint && npm run build
