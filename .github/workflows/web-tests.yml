name: React Web Tests

on:
  push:
    branches: ["main", "dev", "features/**", "agentic-ai/**", "claude/**", "codex/**", "antigravity/**", "gemini/**", "maintenance/**", "bug-fixes/**"]
    paths:
      - "apps/web/**"
      - "docs/contracts/**"
      - "docs/api/**"
      - "docs/architecture/**"
      - "docs/development/ui-integration.md"
      - "scripts/validation/**"
      - ".github/scripts/**"
      - ".github/workflows/web-tests.yml"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/ui-integration.yml"
  pull_request:
    branches: ["main", "dev", "features/**", "agentic-ai/**", "claude/**", "codex/**", "antigravity/**", "gemini/**", "maintenance/**", "bug-fixes/**"]
    paths:
      - "apps/web/**"
      - "docs/contracts/**"
      - "docs/api/**"
      - "docs/architecture/**"
      - "docs/development/ui-integration.md"
      - "scripts/validation/**"
      - ".github/scripts/**"
      - ".github/workflows/web-tests.yml"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/ui-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail

          target="$REF_NAME"
          affected=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            affected=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            target="$BASE_REF"
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          else
            diff_range="${BEFORE_SHA}..${CURRENT_SHA}"
          fi

          if [[ "$target" == "main" || "$target" == "dev" || ("$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^0+$) ]]; then
            affected=true
          elif [[ "$affected" != true ]] && git diff --name-only "$diff_range" | grep -Eq '^(apps/web/|docs/contracts/|docs/api/|docs/architecture/|docs/development/ui-integration\.md$|scripts/validation/|\.github/(scripts/|workflows/(web-tests|web-ci|ui-integration)\.yml$))'; then
            affected=true
          fi

          echo "React Web test workflow affected: $affected"
          echo "affected=$affected" >> "$GITHUB_OUTPUT"

      - name: Not affected
        if: steps.scope.outputs.affected != 'true'
        run: |
          echo "Not affected - no React web test paths changed on this development branch."
          {
            echo "## React Web Tests: Not affected"
            echo "No React web test paths changed; the workflow completed without running the suite."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.affected == 'true'
        with:
          node-version: 24

      - name: Install web dependencies
        if: steps.scope.outputs.affected == 'true'
        working-directory: apps/web
        run: npm install

      - name: Discover and run all React test cases
        id: tests
        if: steps.scope.outputs.affected == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p test-results/web
          echo "Test pass/fail is determined by the complete test assertions, not by one response field or HTTP status alone."
          mapfile -t test_files < <(find apps/web/src apps/web/e2e -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.test.js' -o -name '*.test.jsx' -o -name '*.spec.js' -o -name '*.spec.jsx' \) -print 2>/dev/null | sort)
          if [[ ${#test_files[@]} -eq 0 ]]; then
            echo "No React test cases found in the default web test locations: apps/web/src or apps/web/e2e."
            echo "This workflow currently reports zero tests until the web test suite is added."
            printf '0\n' > test-results/web/no-tests.marker
            exit 0
          fi

          relative_test_files=()
          for test_file in "${test_files[@]}"; do
            relative_test_files+=("${test_file#apps/web/}")
          done

          if ! node -e "const p=require('./apps/web/package.json'); process.exit(p.scripts && p.scripts['test:ci'] ? 0 : 1)"; then
            echo "React test files exist, but apps/web/package.json has no test:ci script."
            exit 1
          fi

          npm --prefix apps/web run test:ci -- --test-reporter=junit --test-reporter-destination="$PWD/test-results/web/junit.xml" "${relative_test_files[@]}" 2>&1 | tee test-results/web/console.log
          test_status=${PIPESTATUS[0]}
          python .github/scripts/report_test_metrics.py --results-root test-results/web --scope "React Web" --require-results
          metrics_status=$?
          if [[ "$test_status" -eq 0 && "$metrics_status" -ne 0 ]]; then
            test_status=$metrics_status
          fi
          exit "$test_status"

      - name: Report zero-test metrics
        if: steps.scope.outputs.affected == 'true' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          if [[ -f test-results/web/no-tests.marker ]]; then
            python .github/scripts/report_test_metrics.py --results-root test-results/web --scope "React Web"
          fi

      - name: Upload React test results
        if: always() && steps.scope.outputs.affected == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: react-web-test-results
          path: test-results/web
          if-no-files-found: ignore

      - name: Final failed React test case list
        if: always() && steps.scope.outputs.affected == 'true'
        shell: bash
        run: python .github/scripts/report_test_metrics.py --results-root test-results/web --scope "React Web" --failures-only
