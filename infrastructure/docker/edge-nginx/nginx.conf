worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    upstream blueverse_frontend {
        server frontend:80;
    }

    upstream blueverse_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        error_page 404 =404 /_blueverse/errors/404;
        error_page 500 502 503 504 =500 /_blueverse/errors/500;

        location = /404.html { return 308 /404; }
        location = /500.html { return 308 /500; }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        location = /_blueverse/errors/404 {
            internal;
            alias /usr/share/nginx/html/404.html;
        }

        location = /_blueverse/errors/500 {
            internal;
            alias /usr/share/nginx/html/500.html;
        }

        location /api/ {
            proxy_intercept_errors off;
            proxy_pass http://blueverse_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_intercept_errors on;
            proxy_pass http://blueverse_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
